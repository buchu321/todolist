<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>180-Day Curriculum</title>

<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: system-ui, sans-serif;
  background: #f5f5f7;
  color: #222;
  height: 100vh;
}

.app {
  display: flex;
  height: 100vh;
}

/* ===== SIDEBAR ===== */
.sidebar {
  width: 280px;
  background: #111;
  color: #fff;
  padding: 16px;
  overflow-y: auto;
}

.sidebar li {
  list-style: none;
  padding: 8px;
  cursor: pointer;
  border-radius: 4px;
}

.sidebar li:hover {
  background: #2a2a2a;
}

/* ===== MAIN ===== */
.main {
  flex: 1;
  overflow-y: auto;
  padding: 20px;
}

.content {
  max-width: 900px;
  margin: auto;
}

/* ===== MOBILE DROPDOWN ===== */
.mobile-day-select {
  display: none;
  margin-bottom: 12px;
}

.mobile-day-select select {
  width: 100%;
  padding: 10px;
  font-size: 16px;
}

/* ===== STICKY TOP ===== */
.sticky {
  position: sticky;
  top: 0;
  z-index: 20;
  background: #f5f5f7;
  padding-bottom: 10px;
}

/* ===== MISSION + PROGRESS ===== */
.mission {
  background: linear-gradient(135deg,#6a5cff,#8f7bff);
  color: #fff;
  padding: 14px;
  border-radius: 10px;
  margin-bottom: 8px;
}

.progress-bar {
  background: #ddd;
  height: 8px;
  border-radius: 6px;
  overflow: hidden;
}

.progress-fill {
  height: 100%;
  width: 0%;
  background: #2ecc71;
  transition: width 0.3s ease;
}

/* ===== SECTIONS ===== */
section {
  background: #fff;
  border-radius: 8px;
  padding: 16px;
  margin: 18px 0;
  box-shadow: 0 2px 6px rgba(0,0,0,.05);
}

section.completed {
  border-left: 6px solid #2ecc71;
  background: #f0fff6;
}

section.collapsed .tasks {
  display: none;
}

section h2 {
  margin-bottom: 10px;
}

/* ===== TASKS ===== */
.tasks label {
  display: block;
  margin-bottom: 6px;
  cursor: pointer;
}

/* ===== RESPONSIVE ===== */
@media (max-width:768px){
  .sidebar { display:none; }
  .mobile-day-select { display:block; }
}
</style>
</head>

<body>

<div class="app">

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <ul id="day-list"></ul>
  </aside>

  <!-- MAIN -->
  <main class="main">

    <!-- MOBILE DROPDOWN -->
    <div class="mobile-day-select">
      <select id="day-dropdown">
        <option value="">Select a Day</option>
      </select>
    </div>

    <div id="content" class="content">
      Select a day to begin
    </div>

  </main>
</div>

<script>
let days = [];

/* LOAD JSON */
fetch("curriculum2.json")
  .then(r => r.json())
  .then(d => {
    days = d.days || [];
    buildSidebar();
    buildDropdown();
  });

/* SIDEBAR */
function buildSidebar() {
  const ul = document.getElementById("day-list");
  ul.innerHTML = "";
  days.forEach(day => {
    const li = document.createElement("li");
    li.textContent = `Day ${day.day}: ${day.title || ""}`;
    li.onclick = () => loadDay(day.day);
    ul.appendChild(li);
  });
}

/* DROPDOWN */
function buildDropdown() {
  const dropdown = document.getElementById("day-dropdown");
  days.forEach(day => {
    const opt = document.createElement("option");
    opt.value = day.day;
    opt.textContent = `Day ${day.day}: ${day.title || ""}`;
    dropdown.appendChild(opt);
  });

  dropdown.onchange = e => {
    if (e.target.value) loadDay(Number(e.target.value));
  };
}

/* LOAD DAY */
function loadDay(dayNum) {
  const day = days.find(d => d.day === dayNum);
  if (!day) return;

  const content = document.getElementById("content");
  content.innerHTML = `
    <div class="sticky">
      <div class="mission">🎯 Complete all tasks for Day ${day.day}</div>
      <div class="progress-bar">
        <div class="progress-fill" id="progressFill"></div>
      </div>
    </div>
    <h1>Day ${day.day}: ${day.title}</h1>
  `;

  /* TASK-BASED SECTIONS */
  renderTaskSection(content,"Warmup",day.warmup?.tasks);
  renderTaskSection(content,"Review",day.review?.tasks);
  renderTaskSection(content,"Exercises",day.exercise?.tasks);
  renderTaskSection(content,"Resources",flatten(day.resources));

  /* INFO-ONLY SECTIONS (NO CHECKBOXES) */
  renderLesson(content, day.lesson);
  renderSimpleSection(content, "Photoshop Setup", day.photoshop?.setup);
  renderSimpleSection(content, "Reflection Notes", day.notes_prompt);
  renderFinalTask(content, day.final_task);
}

/* TASK SECTIONS */
function renderTaskSection(parent,title,tasks){
  if(!Array.isArray(tasks) || !tasks.length) return;

  const section = document.createElement("section");
  const h2 = document.createElement("h2");
  h2.textContent = title;

  const taskWrap = document.createElement("div");
  taskWrap.className = "tasks";

  tasks.forEach(task=>{
    const label = document.createElement("label");
    const cb = document.createElement("input");
    cb.type = "checkbox";

    cb.addEventListener("change",()=>{
      updateSection(section);
      updateProgress();
    });

    label.appendChild(cb);
    label.append(" " + task);
    taskWrap.appendChild(label);
  });

  section.appendChild(h2);
  section.appendChild(taskWrap);
  parent.appendChild(section);
}

/* INFO SECTIONS */
function renderLesson(parent, lesson){
  if(!lesson) return;

  const section = document.createElement("section");
  section.innerHTML = `
    <h2>Lesson</h2>
    <p><strong>Focus:</strong> ${lesson.focus || ""}</p>
    <ul>${(lesson.notes || []).map(n=>`<li>${n}</li>`).join("")}</ul>
  `;
  parent.appendChild(section);
}

function renderSimpleSection(parent, title, items){
  if(!items) return;

  const section = document.createElement("section");
  section.innerHTML = `<h2>${title}</h2>`;

  if(Array.isArray(items)){
    const ul = document.createElement("ul");
    items.forEach(i=>{
      const li = document.createElement("li");
      li.textContent = i;
      ul.appendChild(li);
    });
    section.appendChild(ul);
  } else {
    const p = document.createElement("p");
    p.textContent = items;
    section.appendChild(p);
  }

  parent.appendChild(section);
}

function renderFinalTask(parent, task){
  if(!task) return;

  const section = document.createElement("section");
  section.innerHTML = `
    <h2>Final Task</h2>
    <p>${task}</p>
  `;
  parent.appendChild(section);
}

/* LOGIC */
function updateSection(section){
  const boxes = section.querySelectorAll("input[type=checkbox]");
  const checked = section.querySelectorAll("input[type=checkbox]:checked");

  if(!boxes.length) return;

  if(boxes.length === checked.length){
    section.classList.add("completed","collapsed");
  } else {
    section.classList.remove("completed","collapsed");
  }
}

function updateProgress(){
  const all = document.querySelectorAll("input[type=checkbox]");
  const checked = document.querySelectorAll("input[type=checkbox]:checked");

  if(!all.length) return;

  const percent = Math.round((checked.length / all.length) * 100);
  document.getElementById("progressFill").style.width = percent + "%";
}

function flatten(res){
  if(!res) return [];
  return Object.values(res).flat();
}
</script>

</body>
</html>
