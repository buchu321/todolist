<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Week Tracker</title>
  <style>
    * {
  box-sizing: border-box;
}

body {
  font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
  background: #0f172a;
  color: #e5e7eb;
  padding: 20px;
}

.container {
  max-width: 600px;
  margin: auto;
  background: #020617;
  padding: 20px;
  border-radius: 12px;
}

h1 {
  text-align: center;
  margin-bottom: 20px;
}

.section {
  margin-bottom: 20px;
}

.section h2 {
  font-size: 18px;
  margin-bottom: 10px;
  border-bottom: 1px solid #334155;
  padding-bottom: 4px;
}

.task {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 6px 0;
}

.task label {
  font-size: 14px;
}

/* Toggle switch */
.switch {
  position: relative;
  width: 42px;
  height: 22px;
}

.switch input {
  display: none;
}

.slider {
  position: absolute;
  cursor: pointer;
  background-color: #334155;
  border-radius: 22px;
  inset: 0;
  transition: 0.2s;
}

.slider::before {
  content: "";
  position: absolute;
  height: 18px;
  width: 18px;
  left: 2px;
  top: 2px;
  background: white;
  border-radius: 50%;
  transition: 0.2s;
}

input:checked + .slider {
  background-color: #22c55e;
}

input:checked + .slider::before {
  transform: translateX(20px);
}

.reset-btn {
  width: 100%;
  margin-top: 20px;
  padding: 12px;
  font-size: 16px;
  background: #dc2626;
  border: none;
  border-radius: 8px;
  color: white;
  cursor: pointer;
}

.reset-btn:hover {
  background: #b91c1c;
}

  </style>
</head>
<body>

  <div class="container">
    <h1>Week Tracker</h1>

    <div id="tracker"></div>

    <button id="resetBtn" class="reset-btn">Reset Day</button>
  </div>

  <script>
    const SUPABASE_URL = "https://nxbhrwztqivalyaxbodt.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im54Ymhyd3p0cWl2YWx5YXhib2R0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjgxNTAxNTQsImV4cCI6MjA4MzcyNjE1NH0.-h0URoccYncxURRs8fXNmAr-iw_SL6rk-NrP73u5ppU";

const BUCKET_NAME = "images";
const FILE_PATH = "dayBase.json";

const trackerEl = document.getElementById("tracker");
const resetBtn = document.getElementById("resetBtn");
const REPORT_FILE = "dayReport.json";

let dayData = null;

async function fetchReport() {
  const res = await fetch(
    `${SUPABASE_URL}/storage/v1/object/public/${BUCKET_NAME}/${REPORT_FILE}?t=${Date.now()}`,
    { cache: "no-store" }
  );

  if (res.status === 404) {
    return {};
  }

  if (!res.ok) {
    throw new Error("Failed to fetch dayReport.json");
  }

  return await res.json();
}

async function updateReport(reportData) {
  const res = await fetch(
    `${SUPABASE_URL}/storage/v1/object/${BUCKET_NAME}/${REPORT_FILE}?upsert=true`,
    {
      method: "PUT",
      headers: {
        "apikey": SUPABASE_ANON_KEY,
        "Authorization": `Bearer ${SUPABASE_ANON_KEY}`,
        "Content-Type": "application/json"
      },
      body: JSON.stringify(reportData, null, 2)
    }
  );

  if (!res.ok) {
    console.error(await res.text());
    throw new Error("Failed to update dayReport.json");
  }
}

/* ---------------- FETCH JSON (READ) ---------------- */
async function fetchDay() {
  const res = await fetch(
    `${SUPABASE_URL}/storage/v1/object/public/${BUCKET_NAME}/${FILE_PATH}?t=${Date.now()}`,
    {
      cache: "no-store"
    }
  );

  if (!res.ok) {
    alert("Failed to load JSON");
    return;
  }

  dayData = await res.json();
  render();
}


/* ---------------- UPDATE JSON (WRITE) ---------------- */
async function updateDay() {
  const res = await fetch(
    `${SUPABASE_URL}/storage/v1/object/${BUCKET_NAME}/${FILE_PATH}?upsert=true`,
    {
      method: "PUT",
      headers: {
        "apikey": SUPABASE_ANON_KEY,
        "Authorization": `Bearer ${SUPABASE_ANON_KEY}`,
        "Content-Type": "application/json"
      },
      body: JSON.stringify(dayData)
    }
  );

  if (!res.ok) {
    console.error("Update failed", await res.text());
    alert("Failed to update JSON (check Supabase policy)");
  }
}

/* ---------------- RENDER UI ---------------- */
function render() {
  trackerEl.innerHTML = "";

  for (const sectionKey in dayData.day) {
    const section = document.createElement("div");
    section.className = "section";

    const title = document.createElement("h2");
    title.textContent = sectionKey;
    section.appendChild(title);

    const tasks = dayData.day[sectionKey];

    for (const taskKey in tasks) {
      const row = document.createElement("div");
      row.className = "task";

      const label = document.createElement("label");
      label.textContent = taskKey;

      const toggle = document.createElement("label");
      toggle.className = "switch";

      const checkbox = document.createElement("input");
      checkbox.type = "checkbox";
      checkbox.checked = tasks[taskKey];

      checkbox.addEventListener("change", async () => {
        tasks[taskKey] = checkbox.checked;
        await updateDay();
      });

      const slider = document.createElement("span");
      slider.className = "slider";

      toggle.appendChild(checkbox);
      toggle.appendChild(slider);

      row.appendChild(label);
      row.appendChild(toggle);
      section.appendChild(row);
    }

    trackerEl.appendChild(section);
  }
}

/* ---------------- RESET DAY ---------------- */
resetBtn.addEventListener("click", async () => {
  try {
    /* 1️⃣ Load existing report */
    const reportData = await fetchReport();

    /* 2️⃣ Determine next index */
    const keys = Object.keys(reportData)
      .map(k => Number(k))
      .filter(n => !isNaN(n));

    const nextIndex = keys.length === 0 ? 1 : Math.max(...keys) + 1;

    /* 3️⃣ Append snapshot */
    reportData[nextIndex] = JSON.parse(JSON.stringify(dayData.day));

    /* 4️⃣ Save report */
    await updateReport(reportData);

    /* 5️⃣ Reset dayBase.json */
    for (const section in dayData.day) {
      for (const task in dayData.day[section]) {
        dayData.day[section][task] = false;
      }
    }

    await updateDay();
    render();

    alert(`Day saved as report #${nextIndex}`);

  } catch (err) {
    console.error(err);
    alert("Reset failed. Check console.");
  }
});


/* ---------------- INIT ---------------- */
fetchDay();


  </script>
</body>
</html>
