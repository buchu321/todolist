<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>My Weekly Care Routine</title>

    <!-- Google Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&family=Inter:wght@400;600&display=swap"
      rel="stylesheet"
    />

    <style>
      :root {
        --primary: #6c63ff;
        --secondary: #00bfa6;
        --bg: #f4f6fb;
        --card: #ffffff;
        --text-dark: #1f2937;
        --text-light: #6b7280;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: "Inter", sans-serif;
        background: var(--bg);
        color: var(--text-dark);
      }

      header {
        padding: 18px;
        background: linear-gradient(135deg, var(--primary), #857dff);
        color: white;
        text-align: center;
        border-bottom-left-radius: 18px;
        border-bottom-right-radius: 18px;
      }

      header h1 {
        font-family: "Poppins", sans-serif;
        font-weight: 600;
        margin: 0;
        font-size: 20px;
      }

      .container {
        padding: 16px;
        max-width: 480px;
        margin: auto;
      }

      .day-selector {
        margin: 16px 0 20px;
      }

      select {
        width: 100%;
        padding: 14px;
        border-radius: 12px;
        border: none;
        font-size: 16px;
        font-family: "Poppins", sans-serif;
        background: white;
        box-shadow: 0 8px 18px rgba(0, 0, 0, 0.08);
      }

      .time-block {
        margin-bottom: 24px;
      }

.time-title {
  font-family: "Poppins", sans-serif;
  font-weight: 600;
  font-size: 22px;
  text-align: center;
  margin: 28px 0 18px;
  color: #ffffff;
  background: linear-gradient(135deg, #6c63ff, #857dff);
  padding: 10px 0;
  border-radius: 14px;
  letter-spacing: 0.5px;
}



.section-title {
  font-family: "Poppins", sans-serif;
  font-size: 17px;
  font-weight: 500;
  text-align: center;
  margin: 18px 0 12px;
  color: #374151;
  text-transform: capitalize;
  position: relative;
}


      .product-card {
        background: var(--card);
        border-radius: 16px;
        overflow: hidden;
        margin-bottom: 14px;
        box-shadow: 0 10px 22px rgba(0, 0, 0, 0.08);
      }

.product-image img {
  width: 100%;
  height: auto;
  display: block;
  object-fit: contain;
}


      .product-content {
  padding: 16px;
  text-align: center;
}


   .product-name {
  font-family: "Poppins", sans-serif;
  font-weight: 600;
  font-size: 17px;
  margin-bottom: 12px;
  color: #1f2937;
}


.info-row {
  font-size: 13px;
  margin-bottom: 8px;
  padding: 8px 10px;
  background: #f9fafb;
  border-radius: 10px;
  color: #4b5563;
  text-align: left;
  display: flex;
  align-items: center;
  gap: 6px;
}


.info-row span {
  display: block;
  font-weight: 600;
  font-size: 12px;
  color: #6c63ff;
  margin-bottom: 2px;
}
.info-row strong {
  color: #6c63ff;
  font-weight: 600;
  white-space: nowrap;
}


      footer {
        text-align: center;
        font-size: 12px;
        color: var(--text-light);
        padding: 16px;
      }

      .section-title::after {
  content: "";
  display: block;
  width: 60px;
  height: 3px;
  background: linear-gradient(90deg, #6c63ff, #00bfa6);
  margin: 8px auto 0;
  border-radius: 4px;
}

      
    </style>
  </head>

  <body>
    <header>
      <h1>My Weekly Care Routine</h1>
    </header>

    <div class="container">
      <!-- DAY SELECT -->
      <div class="day-selector">
        <select id="daySelect"></select>
      </div>

      <!-- ROUTINE CONTENT -->
      <div id="routineContent"></div>
    </div>

    <footer>Built for daily clarity ✨</footer>

    <script>
      const JSON_URL = "https://nxbhrwztqivalyaxbodt.supabase.co/storage/v1/object/public/images/Pcare.json";

      function getQueryParam(param) {
        return new URLSearchParams(window.location.search).get(param);
      }

      function setQueryParam(day) {
        const url = new URL(window.location);
        url.searchParams.set("day", day);
        history.pushState({}, "", url);
      }

      function renderDropdown(days, activeDay) {
        const select = document.getElementById("daySelect");
        select.innerHTML = "";

        days.forEach((day) => {
          const opt = document.createElement("option");
          opt.value = day;
          opt.textContent = day.charAt(0).toUpperCase() + day.slice(1);
          if (day === activeDay) opt.selected = true;
          select.appendChild(opt);
        });

        select.onchange = () => {
          setQueryParam(select.value);
          loadDay(select.value);
        };
      }

      function renderRoutine(dayData) {
        const container = document.getElementById("routineContent");
        container.innerHTML = "";

        ["morning", "evening"].forEach((time) => {
          if (!dayData[time]) return;

          const timeBlock = document.createElement("div");
          timeBlock.className = "time-block";
          const timeIcon = time === "morning" ? "🌅 Morning" : "🌙 Evening";
timeBlock.innerHTML = `<div class="time-title">${timeIcon}</div>`;

          Object.entries(dayData[time]).forEach(
            ([sectionName, sectionData]) => {
              const sectionTitle = document.createElement("div");
              sectionTitle.className = "section-title";
              const icons = {
  shower: "🚿 Shower",
  faceCare: "✨ Face Care",
  hairCare: "💆 Hair Care",
  bodyCare: "🧴 Body Care",
  buttCare: "🍑 Butt Care",
  groinCare: "🩲 Groin Care",
  dentalCare: "🦷 Dental Care",
  odourCare: "🌿 Odour Care"
};

sectionTitle.textContent = icons[sectionName] || sectionName;

              timeBlock.appendChild(sectionTitle);

              Object.values(sectionData).forEach((item) => {
                const card = document.createElement("div");
                card.className = "product-card";
                card.innerHTML = `
            <div class="product-image">
                    ${
                        item.image
                        ? `<img 
                            src="${item.image}" 
                            loading="lazy"
                            alt="${item.name || "Product image"}"
                            />`
                        : `<div class="image-placeholder">No Image</div>`
                    }
            </div>

          <div class="product-content">
            <div class="product-name">${item.name || "Product"}</div>
           <div class="info-row">⏰ <strong>When:</strong> ${item.whenToUse || "-"}</div>
<div class="info-row">🧴 <strong>How:</strong> ${item.howToUse || "-"}</div>
<div class="info-row">⏳ <strong>Duration:</strong> ${item.duration || "-"}</div>
<div class="info-row">🚿 <strong>Wash:</strong> ${item.washProcedure || "-"}</div>
<div class="info-row">💡 <strong>Tip:</strong> ${item.tip || "-"}</div>


          </div>
        `;

                timeBlock.appendChild(card);
              });
            }
          );

          container.appendChild(timeBlock);
        });
      }

      async function loadDay(day) {
        const res = await fetch(JSON_URL);
        const data = await res.json();
        renderRoutine(data.weekPlan[day]);
      }

      (async function init() {
        const res = await fetch(JSON_URL);
        const data = await res.json();
        const days = Object.keys(data.weekPlan);
        const day = getQueryParam("day") || days[0];
        renderDropdown(days, day);
        loadDay(day);
      })();
    </script>
  </body>
</html>
