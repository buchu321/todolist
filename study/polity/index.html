<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Polity Chapters changed</title>
  <link rel="stylesheet" href="../../style.css">
  <script src="https://unpkg.com/@supabase/supabase-js@2.39.3/dist/umd/supabase.js"></script>

  <style>
    #popup{
      display:none;position:fixed;top:0;left:0;width:100%;height:100%;
      background:rgba(0,0,0,0.6);justify-content:center;align-items:center;
    }
    #popupBox{
      background:white;padding:20px;border-radius:12px;width:80%;max-width:400px;
    }
    .no-data{
      text-align:center;font-size:18px;margin-top:20px;opacity:0.7;
    }
  </style>
</head>
<body>

<h1>Polity Chapters</h1>

<div id="chapterGrid"></div>
<p id="noChaptersMsg" class="no-data" style="display:none;">No chapters yet.</p>

<button onclick="openPopup()" style="margin-top:20px;">➕ Add Chapter</button>

<div id="popup">
  <div id="popupBox">
    <h3>New Chapter</h3>
    <input type="text" id="chapterName" placeholder="chapter name"><br><br>
    <input type="file" id="chapterImage" accept="image/*"><br><br>
    <button onclick="addChapter()">Upload</button>
    <button onclick="closePopup()">Cancel</button>
  </div>
</div>

<script>
/* CONFIG — YOUR KEYS */
const SB_URL = "https://nxbhrwztqivalyaxbodt.supabase.co";
const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im54Ymhyd3p0cWl2YWx5YXhib2R0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjgxNTAxNTQsImV4cCI6MjA4MzcyNjE1NH0.-h0URoccYncxURRs8fXNmAr-iw_SL6rk-NrP73u5ppU";
const STUDY_BUCKET = "images";
const IMG_BUCKET = "images";
const SUBJECT = "polity";

const SBCLI = window.supabase.createClient(SB_URL, SB_KEY);

/* LOAD CHAPTERS */
async function loadChapters(){
  const msg = document.getElementById("noChaptersMsg");
  const grid = document.getElementById("chapterGrid");

  grid.innerHTML = "";
  msg.style.display = "none";

  const { data, error } = await SBCLI.storage.from(STUDY_BUCKET).download("study.json");
  if (error) { msg.innerText="Unable to load chapters."; msg.style.display="block"; return; }

  let study = {};
  try {
    study = JSON.parse(await data.text());
  } catch(e){
    msg.innerText="Invalid study.json format";
    msg.style.display="block";
    return;
  }

  const chaptersObj = study[SUBJECT]?.chapters;
  if (!chaptersObj || typeof chaptersObj !== "object"){
    msg.style.display="block";
    return;
  }

  const chapterNames = Object.keys(chaptersObj);

  if (chapterNames.length === 0){
    msg.style.display="block";
    return;
  }

  chapterNames.forEach(chName => {
    const imgUrl = `${SB_URL}/storage/v1/object/public/${IMG_BUCKET}/study/${SUBJECT}/${chName}/main.jpg`;

    const div = document.createElement("div");
    div.className = "imageBox";
    div.innerHTML = `
      <a href="chapter.html?name=${chName}">
        <img src="${imgUrl}" alt="${chName}" style="width:100%;border-radius:12px;">
      </a>
      <p style="text-align:center">${chName}</p>
    `;
    grid.appendChild(div);
  });
}

loadChapters();

/* POPUP */
function openPopup(){ document.getElementById("popup").style.display="flex"; }
function closePopup(){ document.getElementById("popup").style.display="none"; }

/* ADD CHAPTER */
async function addChapter(){
  const name = document.getElementById("chapterName").value.trim();
  const file = document.getElementById("chapterImage").files[0];
  if (!name || !file){ alert("Enter name & select image"); return; }

  const folder = `study/${SUBJECT}/${name}`;

  await SBCLI.storage.from(IMG_BUCKET)
    .upload(`${folder}/keep.txt`, new Blob([" "],{type:"text/plain"}), { upsert:true });

  await SBCLI.storage.from(IMG_BUCKET)
    .upload(`${folder}/main.jpg`, file, { upsert:true });

  const { data } = await SBCLI.storage.from(STUDY_BUCKET).download("study.json");
  const study = JSON.parse(await data.text());

  if(!study[SUBJECT].chapters) study[SUBJECT].chapters = {};
  study[SUBJECT].chapters[name] = []; // notes array

  const newJson = new Blob([JSON.stringify(study,null,2)], { type:"application/json" });
  await SBCLI.storage.from(STUDY_BUCKET).upload("study.json", newJson, { upsert:true });

  closePopup();
  loadChapters();
}
</script>

</body>
</html>
