<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Polity Chapters</title>
  <link rel="stylesheet" href="../../style.css">
  <script src="https://unpkg.com/@supabase/supabase-js@2.39.3/dist/umd/supabase.js"></script>


  <style>
    #popup {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.6);
      justify-content: center;
      align-items: center;
    }
    #popupBox {
      background: white;
      padding: 20px;
      border-radius: 12px;
      width: 80%;
      max-width: 400px;
    }
  </style>
</head>
<body>

<h1>Polity Chapters</h1>

<div id="chapterGrid"></div>

<button onclick="openPopup()" style="margin-top:20px;">➕ Add Chapter</button>

<!-- POPUP -->
<div id="popup">
  <div id="popupBox">
    <h3>Add New Chapter</h3>
    <input type="text" id="chapterName" placeholder="chapter name"><br><br>
    <input type="file" id="chapterImage" accept="image/*"><br><br>
    <button onclick="addNewChapter()">Upload</button>
    <button onclick="closePopup()">Cancel</button>
  </div>
</div>

<script>
/* 🔧 CONFIG */
const SB_URL = "https://nxbhrwztqivalyaxbodt.supabase.co";
const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im54Ymhyd3p0cWl2YWx5YXhib2R0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjgxNTAxNTQsImV4cCI6MjA4MzcyNjE1NH0.-h0URoccYncxURRs8fXNmAr-iw_SL6rk-NrP73u5ppU";

const STUDY_BUCKET = "images";
const IMG_BUCKET = "images";
const SUBJECT_NAME = "polity";

/* 🧠 NEW supabase variable name */
const STUDY_DB = supabase.createClient(SB_URL, SB_KEY);

/* 📌 LOAD chapters from study.json */
async function loadChapters(){
  const { data, error } = await STUDY_DB
    .storage.from(STUDY_BUCKET)
    .download("study.json");

  if(error){
    console.error("JSON read error:", error);
    return;
  }

  const studyObj = JSON.parse(await data.text());
  const chapters = studyObj[SUBJECT_NAME].chapters || [];
  const grid = document.getElementById("chapterGrid");
  grid.innerHTML = "";

  chapters.forEach(ch => {
    const imgUrl = `${SB_URL}/storage/v1/object/public/${IMG_BUCKET}/study/${SUBJECT_NAME}/${ch}/main.jpg`;

    const div = document.createElement("div");
    div.className = "imageBox";
    div.innerHTML = `
      <a href="chapter.html?name=${ch}">
        <img src="${imgUrl}" alt="${ch}">
      </a>
      <p style="text-align:center">${ch}</p>
    `;
    grid.appendChild(div);
  });
}

loadChapters();

/* 🎛 Popup Controls */
function openPopup(){ document.getElementById("popup").style.display="flex"; }
function closePopup(){ document.getElementById("popup").style.display="none"; }

/* ✨ ADD NEW CHAPTER */
async function addNewChapter(){
  const chName = document.getElementById("chapterName").value.trim();
  const file = document.getElementById("chapterImage").files[0];

  if(!chName || !file){
    alert("Enter a chapter name & select an image");
    return;
  }

  const baseFolder = `study/${SUBJECT_NAME}/${chName}`;

  /* 1️⃣ Create folder with keep.txt */
  await STUDY_DB.storage.from(IMG_BUCKET)
    .upload(`${baseFolder}/keep.txt`, new Blob([" "], {type:"text/plain"}), { upsert:true });

  /* 2️⃣ Upload main.jpg */
  const { error: imgErr } = await STUDY_DB.storage.from(IMG_BUCKET)
    .upload(`${baseFolder}/main.jpg`, file, { upsert:true });

  if(imgErr){
    alert("Image upload failed");
    console.error(imgErr);
    return;
  }

  /* 3️⃣ Load JSON */
  const { data } = await STUDY_DB.storage.from(STUDY_BUCKET).download("study.json");
  const studyObj = JSON.parse(await data.text());

  /* 4️⃣ Push new chapter */
  if(!studyObj[SUBJECT_NAME].chapters.includes(chName)){
    studyObj[SUBJECT_NAME].chapters.push(chName);
  }

  /* 5️⃣ Upload updated JSON */
  const updatedFile = new Blob([JSON.stringify(studyObj,null,2)], { type:"application/json" });

  await STUDY_DB.storage.from(STUDY_BUCKET)
    .upload(`study.json`, updatedFile, { upsert:true });

  closePopup();
  loadChapters();
}
</script>

</body>
</html>
