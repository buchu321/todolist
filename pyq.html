<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz</title>
<script src="https://unpkg.com/@supabase/supabase-js@2.39.3/dist/umd/supabase.js"></script>
<style>
  .question-box{margin-bottom:20px;padding:15px;border:1px solid #ddd;border-radius:12px;}
  .option-btn{
    width:100%;padding:10px;margin:5px 0;border-radius:8px;border:none;
    background:#f2f2f2;font-size:16px;cursor:pointer;
  }
  .correct{background:#b2ffb2!important;}
  .wrong{background:#ffb2b2!important;}
  .stats{font-size:14px;opacity:0.7;margin-top:5px;}
</style>
</head>
<body>

<h2 id="title"></h2>
<div id="quiz"></div>

<button id="submitBtn" style="margin-top:20px;width:100%;padding:12px;font-size:18px;border-radius:8px;">
  End Quiz & Save Stats
</button>
<!-- RESULT POPUP -->
<div id="resultPopup" style="
  display:none;position:fixed;top:0;left:0;width:100%;height:100%;
  background:rgba(0,0,0,0.6);justify-content:center;align-items:center;
">
  <div style="
    background:white;padding:20px;border-radius:12px;
    width:90%;max-width:450px;max-height:80vh;overflow:auto;
  ">
    <h2>Quiz Summary</h2>
    <p id="summaryText"></p>
    <h3>Questions</h3>
    <div id="wrongList"></div>
    <button onclick="closePopupAndSave()" style="margin-top:15px;padding:10px;width:100%;border-radius:8px;">
      OK
    </button>
  </div>
</div>
</body>
<script>
/* CONFIG */
const SB_URL = "https://nxbhrwztqivalyaxbodt.supabase.co";
const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im54Ymhyd3p0cWl2YWx5YXhib2R0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjgxNTAxNTQsImV4cCI6MjA4MzcyNjE1NH0.-h0URoccYncxURRs8fXNmAr-iw_SL6rk-NrP73u5ppU";
const IMG_BUCKET = "images";

const SBCLI = window.supabase.createClient(SB_URL, SB_KEY);

/* ---- GET PARAMS ---- */
const params = new URLSearchParams(window.location.search);
const SUBJECT = params.get("subject");
const CHAPTER = params.get("chapter");
const TYPE = params.get("type"); // pyq or practice

if (!SUBJECT || !CHAPTER || !TYPE) {
  document.body.innerHTML = `
    <h2 style="text-align:center;margin-top:50px;">
      ❌ Missing URL parameters<br><br>
      Example:<br>
      <code>?subject=polity&chapter=preamble&type=pyq</code>
    </h2>`;
  throw new Error("Missing subject/chapter/type in URL");
}

document.getElementById("title").innerText =
 `${SUBJECT.toUpperCase()} — ${CHAPTER} (${TYPE.toUpperCase()})`;


let questions = [];
let touched = new Set();
let sessionAttempted = 0;
let sessionRight = 0;
let sessionWrong = 0;
let sessionWrongList = [];

/* UTILS */
function shuffle(arr){ return arr.sort(()=>Math.random()-0.5); }

/* LOAD JSON */
async function loadQuiz(){
  const path = `study/${SUBJECT}/${CHAPTER}/${TYPE}.json`;
  const { data, error } = await SBCLI.storage.from(IMG_BUCKET)
    .download(`${path}?t=${Date.now()}`);
  
  if(error){
    document.getElementById("quiz").innerHTML = `<p>No ${TYPE} questions uploaded yet.</p>`;
    document.getElementById("submitBtn").style.display="none";
    return;
  }

  questions = JSON.parse(await data.text());

  shuffle(questions);

  displayQuiz();
}

function displayQuiz(){
  const box = document.getElementById("quiz");
  box.innerHTML = "";

  questions.forEach((q, qi)=>{
    const opts = shuffle([...q.options]);

    q.attempted ??= 0;
    q.right ??= 0;
    q.wrong ??= 0;

    const div=document.createElement("div");
    div.className="question-box";

    const factVisible = touched.has(qi);

    div.innerHTML = `
      <h3>${qi+1}. ${q.question}</h3>
      ${opts.map(o => 
        `<button class="option-btn" onclick="checkAns(this,'${o}',${qi})">${o}</button>`
      ).join("")}
      <p class="stats">Attempted: ${q.attempted} | Right: ${q.right} | Wrong: ${q.wrong}</p>
      <p class="fact" style="margin-top:10px;display:${factVisible ? 'block' : 'none'};font-size:15px;color:#444;">
        <b>Fact:</b> ${q.fact || "No explanation provided"}
      </p>
    `;

    box.appendChild(div);
  });
}

/* ANSWER CHECKING */
function checkAns(btn, selected, qi){
  const q = questions[qi];

  if(touched.has(qi)) return; // only count once
  touched.add(qi);

  // lifetime stats
  q.attempted++;
  sessionAttempted++;

  if(selected === q.correctAnswer){
    // lifetime
    q.right++;
    // session
    sessionRight++;
  } else {
    // lifetime
    q.wrong++;
    // session
    sessionWrong++;
    sessionWrongList.push({
      question: q.question,
      correct: q.correctAnswer,
      yourPick: selected
    });
  }

  displayQuiz();
}

/* SAVE JSON ON END */
async function saveQuiz(){
  // Build popup using session-only stats
  document.getElementById("summaryText").innerText =
    `Attempted: ${sessionAttempted} | Right: ${sessionRight} | Wrong: ${sessionWrong}`;

  const wrongDiv = document.getElementById("wrongList");
  wrongDiv.innerHTML =
    sessionWrongList.length === 0
      ? `<p>🔥 No mistakes this round — Perfect!</p>`
      : sessionWrongList.map(x=>`
        <div style="margin-bottom:12px;padding:8px;border-left:3px solid red;">
          <p><b>Q:</b> ${x.question}</p>
          <p><b>Your Answer:</b> ${x.yourPick}</p>
          <p><b>Correct Answer:</b> ${x.correct}</p>
        </div>
      `).join("");

  document.getElementById("resultPopup").style.display="flex";
}

async function closePopupAndSave(){
  const filePath = `study/${SUBJECT}/${CHAPTER}/${TYPE}.json`;

  const updated = new Blob([JSON.stringify(questions,null,2)],{
    type:"application/json"
  });

  await SBCLI.storage.from(IMG_BUCKET).upload(filePath, updated, { upsert:true });

  // Reset session so next entry is clean
  sessionAttempted = 0;
  sessionRight = 0;
  sessionWrong = 0;
  sessionWrongList = [];
  touched.clear();

  document.getElementById("resultPopup").style.display="none";
  window.history.back();
}


document.getElementById("submitBtn").onclick = saveQuiz;

loadQuiz();
</script>

</body>
</html>
