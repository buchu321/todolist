<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Art & Blender Hub</title>

<style>
  body{
    margin:0;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#1d2671,#c33764);
    font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  }

  .container{
    width:90%;
    max-width:420px;
    background:rgba(255,255,255,0.15);
    backdrop-filter:blur(10px);
    border-radius:20px;
    padding:25px;
    box-shadow:0 20px 40px rgba(0,0,0,0.3);
  }

  h1{
    text-align:center;
    color:white;
    margin-bottom:25px;
    letter-spacing:1px;
  }

  .btn{
    display:block;
    width:100%;
    padding:14px;
    margin:12px 0;
    border:none;
    border-radius:14px;
    font-size:18px;
    font-weight:600;
    cursor:pointer;
    color:#333;
    background:white;
    transition:transform 0.15s ease, box-shadow 0.15s ease;
    box-shadow:0 8px 18px rgba(0,0,0,0.25);
  }

  .btn:hover{
    transform:translateY(-2px);
    box-shadow:0 12px 25px rgba(0,0,0,0.35);
  }

  .btn:active{
    transform:scale(0.98);
  }
</style>
</head>
<body>

<div class="container">
  <h1>Art & Blender</h1>

  <button class="btn" onclick="go('art.html')">🎨 Art</button>
  <button class="btn" onclick="go('animation.html')">🎞️ Animation</button>
  <button class="btn" onclick="go('blender.html')">🧊 Blender</button>
  <button class="btn" onclick="go('sculpting.html')">🗿 Sculpting</button>
  <button class="btn" onclick="go('justDraw.html')">✏️ Just Draw</button>
  <button class="btn" onclick="go('uploadTask.html')">⬆️ Upload Task</button>
  <button class="btn" onclick="go('progress.html')">📈 Show Progress</button>
</div>

<script>
function go(page){
  window.location.href = `../artDetails/${page}`;
}
</script>

</body>
</html>
